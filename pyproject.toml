[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "powerbi-analyzer"
version = "0.1.0"
description = "CLI that audits Power BI on Databricks setups against the cheat-sheet best practices."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Mathieu Pelletier", email = "mathieu.pelletier@databricks.com" }]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "rich>=13.7",
    "msal>=1.28",
    "requests>=2.32",
    "databricks-sdk>=0.30",
    "databricks-sql-connector>=3.3",
    "pbixray>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "vcrpy>=6.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-pyyaml",
    "types-requests",
]

[project.scripts]
pba = "powerbi_analyzer.cli:app"

[project.urls]
Homepage = "https://github.com/mathieu-pelletier/powerbi-analyzer"

[tool.hatch.build.targets.wheel]
packages = ["src/powerbi_analyzer"]

[tool.hatch.build.targets.wheel.force-include]
"src/powerbi_analyzer/pba.example.yaml" = "powerbi_analyzer/pba.example.yaml"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["build/", "dist/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: tests that hit recorded API fixtures",
    "e2e: full-pipeline golden tests",
]

[tool.coverage.run]
source = ["src/powerbi_analyzer"]
branch = true

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
