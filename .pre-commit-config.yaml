repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.20.2
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.6
          - types-pyyaml
          - types-requests
          - pandas-stubs
          - numpy<2.5  # 2.5 stubs use PEP 695 `type`; mypy targets py3.11
          - typer>=0.12
          - pbixray>=0.3
          - jinja2>=3.1
          - databricks-sdk>=0.30
          - databricks-sql-connector>=3.3
        args: [--strict, src/]
        pass_filenames: false

  - repo: local
    hooks:
      - id: rule-shape-check
        name: rule-shape-check
        entry: python scripts/check_rules.py
        language: python
        files: ^src/powerbi_analyzer/rules/.*\.py$
        additional_dependencies: []
